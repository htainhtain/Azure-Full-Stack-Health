name: Build and Push Docker Images

on:
    push:
        branches:
            - main
        
permissions:
    contents: read

env:
    ACR_NAME: finalprojectacr
    ACR_LOGIN_SERVER: finalprojectacr.azurecr.io
    RESOURCE_GROUP: final-project-rg

jobs:
    changes:
        runs-on: ubuntu-latest

        outputs:
            frontend: ${{ steps.filter.outputs.frontend }} 
            backend: ${{ steps.filter.outputs.backend }} 
            nginx: ${{ steps.filter.outputs.nginx }} 
            cache: ${{ steps.filter.outputs.cache }}

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Detect changes
              id: filter
              uses: dorny/paths-filter@v4
              with:
                filters: |
                    frontend:
                        - 'frontend/**'
                    
                    backend:
                        - 'backend/**'        
                        
                    nginx:
                        - 'nginx/**'                        

                    cache:
                        - 'redis/**'

    build-and-push-and-deploy:
        runs-on: ubuntu-latest
        needs: changes

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: 'Login via Azure CLI'
              uses: azure/login@v3
              with:
                creds: ${{ secrets.AZURE_CREDENTIALS }}

            - name: Login to ACR 
              run: | 
                az acr login --name ${{ env.ACR_NAME }}

            - name: Build Docker Compose images 
              run: | 
                docker compose build

            - name: Tag and push frontend image with Git SHA if frontend was changed
              if: needs.changes.outputs.frontend == 'true'
              run: |
                docker tag final-project-frontend:latest ${{ env.ACR_LOGIN_SERVER }}/final-project-frontend:latest
                docker push ${{ env.ACR_LOGIN_SERVER }}/final-project-frontend:latest
                docker tag final-project-frontend:latest ${{ env.ACR_LOGIN_SERVER }}/final-project-frontend:${{ github.sha }} 
                docker push ${{ env.ACR_LOGIN_SERVER }}/final-project-frontend:${{ github.sha }}
            
            - name: Tag and push backend image with Git SHA if backend was changed
              if: needs.changes.outputs.backend == 'true'
              run: |
                docker tag final-project-backend:latest ${{ env.ACR_LOGIN_SERVER }}/final-project-backend:latest
                docker push ${{ env.ACR_LOGIN_SERVER }}/final-project-backend:latest
                docker tag final-project-backend:latest ${{ env.ACR_LOGIN_SERVER }}/final-project-backend:${{ github.sha }} 
                docker push ${{ env.ACR_LOGIN_SERVER }}/final-project-backend:${{ github.sha }}
                
            - name: Tag and push nginx image with Git SHA if nginx was changed
              if: needs.changes.outputs.nginx == 'true'
              run: |
                docker tag final-project-nginx:latest ${{ env.ACR_LOGIN_SERVER }}/final-project-nginx:latest
                docker push ${{ env.ACR_LOGIN_SERVER }}/final-project-nginx:latest
                docker tag final-project-nginx:latest ${{ env.ACR_LOGIN_SERVER }}/final-project-nginx:${{ github.sha }}
                docker push ${{ env.ACR_LOGIN_SERVER }}/final-project-nginx:${{ github.sha }}

            - name: Tag and push nginx image with Git SHA if nginx was changed
              if: needs.changes.outputs.cache == 'true'
              run: |
                docker tag final-project-cache:latest ${{ env.ACR_LOGIN_SERVER }}/final-project-cache:latest
                docker push ${{ env.ACR_LOGIN_SERVER }}/final-project-cache:latest
                docker tag final-project-cache:latest ${{ env.ACR_LOGIN_SERVER }}/final-project-cache:${{ github.sha }}
                docker push ${{ env.ACR_LOGIN_SERVER }}/final-project-cache:${{ github.sha }}

            - name: Get latest Tags
              run: |
                NGINX_TAG=$(az acr repository show-tags --name ${{ env.ACR_LOGIN_SERVER }} --repository final-project-nginx --orderby time_desc --top 1 --output tsv )
                echo "NGINX_TAG=$NGINX_TAG" >> "$GITHUB_ENV"
                CACHE_TAG=$(az acr repository show-tags --name ${{ env.ACR_LOGIN_SERVER }} --repository final-project-cache --orderby time_desc --top 1 --output tsv )
                echo "CACHE_TAG=$CACHE_TAG" >> "$GITHUB_ENV"
                FRONTEND_TAG=$(az acr repository show-tags --name ${{ env.ACR_LOGIN_SERVER }} --repository final-project-frontend --orderby time_desc --top 1 --output tsv )
                echo "FRONTEND_TAG=$FRONTEND_TAG" >> "$GITHUB_ENV"
                BACKEND_TAG=$(az acr repository show-tags --name ${{ env.ACR_LOGIN_SERVER }} --repository final-project-backend --orderby time_desc --top 1 --output tsv )
                echo "BACKEND_TAG=$BACKEND_TAG" >> "$GITHUB_ENV"

            - name: Deploy Azure Container Instance
              env:
                ACR_CREDENTIALS: ${{ secrets.ACR_CREDENTIALS }}
                REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
                FRONTEND_TAG: ${{ github.sha }}
                BACKEND_TAG: ${{ github.sha }}
                CACHE_TAG: ${{ github.sha }}
                NGINX_TAG: ${{ github.sha }}
              run: | 
                az container create --resource-group ${{ env.RESOURCE_GROUP }} --file azure-aci.yml